# ============================================================================
====================================================
name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # pour remonter les résultats SARIF dans l'onglet Security

jobs:
  # ---------------------------------------------------------------- 1. BUILD + TESTS
  build-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier que le backend se charge
        working-directory: backend
        run: python -c "import app.main; print('Backend importé avec succès')"

      - name: Build du frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------- 2. SAST (Semgrep)
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # --error : le pipeline ÉCHOUE si une règle de sévérité ERROR est trouvée (SQLi, XSS...)
      - name: Analyse statique du code
        run: semgrep --config p/python --config p/javascript --config p/owasp-top-ten --error

  # ---------------------------------------------------------------- 3. SECRETS (Gitleaks)
  secrets-scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # L'action échoue si un secret est détecté, SANS afficher sa valeur (§4.3)
      - name: Recherche de secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- 4. DÉPENDANCES (Trivy fs)
  dependencies-scan:
    name: Dépendances - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse des dépendances (CRITICAL/HIGH bloquants)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"          # échoue si une vulnérabilité CRITICAL/HIGH est trouvée
          ignore-unfixed: true

  # ---------------------------------------------------------------- 5. IMAGE + ANALYSE (Trivy image)
  image-scan:
    name: Image - Build & Trivy
    runs-on: ubuntu-latest
    needs: [ build-test ]
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image backend
        run: docker build -t jobboard-backend:ci ./backend

      - name: Analyser l'image backend (CRITICAL/HIGH bloquants)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: jobboard-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------- 6. DAST (OWASP ZAP)
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [ image-scan ]
    steps:
      - uses: actions/checkout@v4

      - name: Préparer l'environnement
        run: cp .env.example .env

      - name: Démarrer l'application (docker compose)
        run: |
          docker compose up -d --build
          echo "Attente du démarrage..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ >/dev/null; then echo "Prêt"; break; fi
            sleep 3
          done

      - name: Scan dynamique ZAP (baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"
          # -I : ne pas faire échouer sur les alertes ici ; le rapport sert de preuve DAST.
          # Pour une politique bloquante stricte, retirer -I.
          cmd_options: "-I"

      - name: Arrêter l'application
        if: always()
        run: docker compose down -v
