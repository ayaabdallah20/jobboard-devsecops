# ============================================================================
#  MODÈLE de secret — NE PAS mettre de vraie valeur ici et NE PAS versionner le
#  fichier réel (§4.4). Le vrai secret "k8s/secret.yaml" est ignoré par .gitignore.
#
#  Deux façons de créer le secret réel (valeurs FICTIVES de laboratoire) :
#
#   A) En ligne de commande (recommandé, rien n'est écrit dans un fichier versionné) :
#      kubectl -n jobboard create secret generic jobboard-secrets \
#        --from-literal=POSTGRES_PASSWORD=jobboard123 \
#        --from-literal=JWT_SECRET=secret123 \
#        --from-literal=DATABASE_URL='postgresql+psycopg://jobboard:jobboard123@postgres:5432/jobboard'
#
#   B) En copiant ce modèle vers k8s/secret.yaml (ignoré par Git) puis :
#      kubectl apply -f k8s/secret.yaml
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jobboard-secrets
  namespace: jobboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REMPLACER"
  JWT_SECRET: "REMPLACER"
  DATABASE_URL: "postgresql+psycopg://jobboard:REMPLACER@postgres:5432/jobboard"
