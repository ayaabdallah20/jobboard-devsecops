# ConfigMap contenant le schéma SQL, monté dans PostgreSQL (initdb) — généré depuis database/schema.sql
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: jobboard
data:
  schema.sql: |
    -- =============================================================================
    --  JobBoard Secure — Schéma de la base de données PostgreSQL
    --  Projet DevSecOps — TEK-UP 2026-2027 — Aya Abdallah & Ameni Azouz
    --
    --  Conception de la base par l'équipe. À exécuter sur la base « jobboard » :
    --      psql -U jobboard -d jobboard -f database/schema.sql
    --
    --  Quatre tables : users, jobs, cvs, applications.
    -- =============================================================================
    
    -- Repartir d'un schéma propre (laboratoire)
    DROP TABLE IF EXISTS applications CASCADE;
    DROP TABLE IF EXISTS cvs          CASCADE;
    DROP TABLE IF EXISTS jobs         CASCADE;
    DROP TABLE IF EXISTS users        CASCADE;
    
    -- -----------------------------------------------------------------------------
    --  Table : users — comptes candidats, recruteurs et administrateurs
    -- -----------------------------------------------------------------------------
    CREATE TABLE users (
        id            SERIAL        PRIMARY KEY,
        email         VARCHAR(255)  NOT NULL UNIQUE,
        password_hash VARCHAR(255)  NOT NULL,
        full_name     VARCHAR(120)  NOT NULL,
        role          VARCHAR(20)   NOT NULL DEFAULT 'candidat',
        is_active     BOOLEAN       NOT NULL DEFAULT TRUE,
        -- Profil (données personnelles fictives)
        phone         VARCHAR(40),
        address       VARCHAR(255),
        city          VARCHAR(80),
        birth_date    DATE,
        headline      VARCHAR(160),
        bio           TEXT,
        skills        VARCHAR(500),
        company       VARCHAR(120),
        created_at    TIMESTAMP     NOT NULL DEFAULT now(),
        CONSTRAINT chk_users_role CHECK (role IN ('candidat', 'recruteur', 'admin'))
    );
    
    CREATE INDEX ix_users_email ON users (email);
    CREATE INDEX ix_users_role  ON users (role);
    
    -- -----------------------------------------------------------------------------
    --  Table : jobs — offres d'emploi publiées par les recruteurs
    -- -----------------------------------------------------------------------------
    CREATE TABLE jobs (
        id            SERIAL        PRIMARY KEY,
        recruiter_id  INTEGER       NOT NULL REFERENCES users (id),
        title         VARCHAR(160)  NOT NULL,
        company       VARCHAR(120)  NOT NULL,
        location      VARCHAR(120)  NOT NULL,
        contract_type VARCHAR(30)   NOT NULL DEFAULT 'CDI',
        salary        VARCHAR(60),
        remote        VARCHAR(30)   NOT NULL DEFAULT 'Sur site',
        description   TEXT          NOT NULL,
        requirements  TEXT,
        status        VARCHAR(20)   NOT NULL DEFAULT 'draft',
        created_at    TIMESTAMP     NOT NULL DEFAULT now(),
        updated_at    TIMESTAMP     NOT NULL DEFAULT now(),
        CONSTRAINT chk_jobs_status CHECK (status IN ('draft', 'published', 'closed'))
    );
    
    CREATE INDEX ix_jobs_recruiter ON jobs (recruiter_id);
    CREATE INDEX ix_jobs_status    ON jobs (status);
    
    -- -----------------------------------------------------------------------------
    --  Table : cvs — CV téléversés par les candidats
    -- -----------------------------------------------------------------------------
    CREATE TABLE cvs (
        id                SERIAL        PRIMARY KEY,
        owner_id          INTEGER       NOT NULL REFERENCES users (id),
        original_filename VARCHAR(255)  NOT NULL,
        stored_path       VARCHAR(500)  NOT NULL,
        content_type      VARCHAR(120),
        size              INTEGER       NOT NULL DEFAULT 0,
        uploaded_at       TIMESTAMP     NOT NULL DEFAULT now()
    );
    
    CREATE INDEX ix_cvs_owner ON cvs (owner_id);
    
    -- -----------------------------------------------------------------------------
    --  Table : applications — candidatures (candidat -> offre, avec CV)
    -- -----------------------------------------------------------------------------
    CREATE TABLE applications (
        id           SERIAL      PRIMARY KEY,
        job_id       INTEGER     NOT NULL REFERENCES jobs (id),
        candidate_id INTEGER     NOT NULL REFERENCES users (id),
        cv_id        INTEGER     REFERENCES cvs (id),
        cover_letter TEXT,
        status       VARCHAR(20) NOT NULL DEFAULT 'envoyee',
        created_at   TIMESTAMP   NOT NULL DEFAULT now(),
        updated_at   TIMESTAMP   NOT NULL DEFAULT now(),
        CONSTRAINT chk_app_status CHECK (status IN ('envoyee', 'en_revue', 'entretien', 'acceptee', 'refusee'))
    );
    
    CREATE INDEX ix_app_job       ON applications (job_id);
    CREATE INDEX ix_app_candidate ON applications (candidate_id);
    
    -- -----------------------------------------------------------------------------
    --  Mise à jour automatique de updated_at (jobs, applications)
    -- -----------------------------------------------------------------------------
    CREATE OR REPLACE FUNCTION set_updated_at() RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = now();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    
    CREATE TRIGGER trg_jobs_updated
        BEFORE UPDATE ON jobs
        FOR EACH ROW EXECUTE FUNCTION set_updated_at();
    
    CREATE TRIGGER trg_app_updated
        BEFORE UPDATE ON applications
        FOR EACH ROW EXECUTE FUNCTION set_updated_at();
    
    -- Fin du schéma. Les données de démonstration (comptes, offres, CV) sont
    -- insérées par l'application au premier démarrage (app/seed.py), car les
    -- fichiers PDF des CV sont générés en même temps.
